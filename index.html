<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genealogía de modelos LLM</title>
  <style>
    :root {
      --bg: #ffffff; --panel: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73;
      --border: rgba(0,0,0,0.08); --accent: #0071e3; --net: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#000; --panel:#1d1d1f; --text:#f5f5f7; --muted:#86868b; --border:rgba(255,255,255,.12); --accent:#2997ff; --net:#0a0a0a; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body.dark {
      --bg:#000; --panel:#1d1d1f; --text:#f5f5f7; --muted:#86868b; --border:rgba(255,255,255,.12); --accent:#2997ff; --net:#0a0a0a;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      transition: background .2s, color .2s;
    }
    header {
      padding: 12px 20px; background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
      position: sticky; top: 0; z-index: 10;
    }
    h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
    h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
    input, select {
      font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; outline: none;
      transition: border .15s, box-shadow .15s;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    #search { width: 170px; }
    select { cursor: pointer; }
    .btn {
      font: inherit; font-size: 12px; font-weight: 500; color: var(--text);
      background: transparent; border: 1px solid var(--border); border-radius: 9px;
      padding: 6px 10px; cursor: pointer; transition: background .15s;
    }
    .btn:hover { background: var(--border); }
    #legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
    .lg { display: inline-flex; align-items: center; gap: 4px; margin-right: 4px; }
    .sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
    main { flex: 1; position: relative; min-height: 0; overflow: hidden; }
    #net { position: absolute; inset: 0; background: var(--net); }
    #net svg { width: 100%; height: 100%; display: block; }
    #net .node { cursor: pointer; }
    #net .node rect { fill-opacity: .16; stroke-width: 1.5; }
    #net .node text { font-size: 11px; font-weight: 600; font-family: -apple-system, "SF Pro Text", Segoe UI, Roboto, sans-serif; pointer-events: none; }
    #net .link { stroke: var(--muted); stroke-opacity: .5; stroke-width: 1.2; }
    #detail {
      position: fixed; right: 14px; top: 70px; width: 252px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 15px;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
      -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
      display: none; z-index: 20;
    }
    #detail .company { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    #detail .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
    #detail h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0 6px; }
    #detail .row { font-size: 12px; color: var(--muted); margin: 3px 0; }
    #detail .row b { color: var(--text); font-weight: 600; }
    #detail .note { font-size: 12px; margin-top: 8px; line-height: 1.5; }
    #detail .from { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
    #detail .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: var(--muted); font-size: 15px; background: none; border: none; }
  </style>
</head>
<body>
  <header>
    <h1>Genealogía de modelos LLM <small id="count"></small></h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Buscar modelo…" autocomplete="off" />
      <select id="fCompany"><option value="">Todas las empresas</option></select>
      <select id="fType"><option value="">Todos los tipos</option></select>
      <select id="fYear"><option value="">Todos los años</option></select>
      <span class="hint" id="legend"></span>
      <button class="btn" id="theme" title="Cambiar tema">◐</button>
    </div>
  </header>
  <main>
    <div id="net"></div>
  </main>
  <aside id="detail"></aside>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="models.js"></script>
  <script src="app.js"></script>
</body>
</html>
